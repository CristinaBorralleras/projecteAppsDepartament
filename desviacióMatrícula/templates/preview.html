{% extends "base.html" %}
{% block title %}Vista prèvia{% endblock %}

{% block content %}
<style>
  h2 {
    color: DarkRed;
    text-align: center;
    margin-bottom: 0.5rem;
  }

  .meta {
    text-align: center;
    color: #555;
    margin-bottom: 1rem;
    font-size: 0.9rem;
  }

  .table-wrapper {
    max-height: 420px;
    overflow: auto;
    border: 1px solid #ddd;
    border-radius: 6px;
  }

  table.preview-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.85rem;
  }

  table.preview-table thead th {
    position: sticky;
    top: 0;
    background: #f0f0f0;
    border-bottom: 1px solid #ccc;
    padding: 8px;
    text-align: left;
  }

  table.preview-table td {
    padding: 6px 8px;
    border-bottom: 1px solid #eee;
  }

  .actions {
    text-align: center;
    margin-top: 1.5rem;
  }

  a.button {
    display: inline-block;
    padding: 10px 22px;
    background: DarkRed;
    color: white;
    text-decoration: none;
    border-radius: 6px;
    font-weight: bold;
    margin: 0 0.4rem;
  }

  a.button.secondary {
    background: #555;
  }
  
  /* Forçar ample gran només a la vista prèvia */
	.app {
	  width: 95%;
	  max-width: 1400px;
	}

</style>

<h2>Vista prèvia</h2>
<div class="meta">
  {{ filename }} · mostrant {{ shown_rows }} de {{ num_rows }} files
</div>

<div class="table-wrapper">
  {{ table | safe }}
</div>

<div class="actions">
  <a href="{{ url_for('download_file', filename=filename) }}" class="button">
    Descarregar Excel
  </a>
  <a href="{{ url_for('resultats') }}" class="button secondary">
    Tornar
  </a>
</div>
{% endblock %}
