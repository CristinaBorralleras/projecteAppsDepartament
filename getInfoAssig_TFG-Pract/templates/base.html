<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">

  <!-- El title només és per la pestanya -->
  <title>{% block title %}Full Dedicació PDI per excel Pràct-TFG{% endblock %}</title>

  <style>
    body {
      font-family: Verdana, sans-serif;
      background: #f5f5f5;
      margin: 0;
    }

    /* ✅ CAPÇALERA PRINCIPAL COMUNA (IGUAL QUE EL PORTAL) */
    h1.main-header {
      margin: 0;
      padding: 1.5rem;
      background: #6f6f6f;
      color: white;
      text-align: center;
      font-size: 1.5rem;
      position: relative;
    }

     h1.main-header a.back-menu {
      position: absolute;
      top: 1rem;
      right: 1rem;
      background: #555;
      color: white;
      padding: 0.5rem 1rem;
      text-decoration: none;
      border-radius: 4px;
    }

    h1.main-header a.back-menu:hover {
      background: #444;
    } 

    .app {
      width: 600px;
      margin: 2rem auto;
    }

    /* ✅ CAPÇALERA ESPECÍFICA DE L'APP (COM ABANS, SENSE CANVIS) */
    .header {
      background: #9a9a9a;
      padding: 1.4rem;
      border-radius: 6px;
      margin-bottom: 2rem;
      text-align: center;
      font-weight: bold;
      font-size: 1.4rem;
      color: white;
      text-shadow: 2px 2px 4px black;
    }

    .content {
      background: white;
      padding: 2rem;
      border-radius: 6px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }

    a.button {
      display: inline-block;
      margin-top: 2rem;
      padding: 10px 20px;
      background-color: #f2f2f2;
      color: black;
      text-decoration: none;
      border-radius: 5px;
    }

    a.button:hover {
      opacity: 0.8;
    }
  </style>
</head>

<body>

  <!-- ✅ CAPÇALERA PRINCIPAL COMUNA -->
  <h1 class="main-header">
    Aplicacions FCTE – Departaments
    <a href="http://localhost:5000" class="back-menu">Tornar al menú</a>
  </h1>

  <div class="app">

    <!-- ✅ CAPÇALERA ESPECÍFICA DE L'APP -->
    <div class="header">
      Full Dedicacions PDI per excel Pràct‑TFG 
    </div>

    <div class="content">
      {% block content %}{% endblock %}
    </div>

  </div>

</body>
</html>
