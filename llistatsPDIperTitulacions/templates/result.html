{% extends "base.html" %}

{% block title %}Resultat{% endblock %}

{% block content %}

<style>
  h2 {
    color: DarkRed;
    text-align: center;
    margin-bottom: 1.5rem;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.9rem;
  }

  th, td {
    padding: 8px;
    border-bottom: 1px solid #ccc;
    text-align: left;
  }

  th {
    background: #f0f0f0;
  }

  .actions {
    text-align: center;
    margin-top: 2rem;
  }

  a.button {
    display: inline-block;
    padding: 12px 24px;
    background: DarkRed;
    color: white;
    text-decoration: none;
    border-radius: 6px;
    font-weight: bold;
    margin: 0 0.5rem;
  }

  a.button.secondary {
    background: #555;
  }
</style>

<h2>Vista prèvia del llistat</h2>

<table>
  <thead>
    <tr>
      <th>Pla d'estudis</th>
      <th>PDI</th>
    </tr>
  </thead>
  <tbody>
    {% for row in rows %}
      <tr>
        <td>{{ row["Pla d'estudis"] }}</td>
        <td>{{ row["PDI"] }}</td>
      </tr>
    {% endfor %}
  </tbody>
</table>

<div class="actions">
  <a href="/download" class="button">
    Descarregar Excel
  </a>

  <a href="/options" class="button secondary">
    Tornar
  </a>
</div>

{% endblock %}
